services:
  - type: web
    name: alumni-connect-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: python scripts/serve.py
    healthCheckPath: /ready
    disk:
      name: gradalumni-documents
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_NAME
        value: alumni-connect-api
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DOCUMENT_STORAGE_PATH
        value: /var/data/private
      - key: STUDENT_DOCUMENT_STORAGE_PATH
        value: /var/data/student_documents
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: CORS_ORIGINS
        value: https://frontend-grad.vercel.app
      - key: SQL_ECHO
        value: "false"
