name: Backend validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gradalumni_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gradalumni_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gradalumni_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      JWT_SECRET_KEY: ci-only-secret-rotated-per-ephemeral-test-environment
      RATE_LIMIT_ENABLED: 'false'
      DATABASE_URL: postgresql+asyncpg://gradalumni_test:ci-only-password@localhost:5432/gradalumni_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: python -m compileall -q app
      - run: pytest -q
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://gradalumni_test:ci-only-password@localhost:5432/gradalumni_test
      - run: pip-audit -r requirements.txt
