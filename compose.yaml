services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: gradalumni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: gradalumni
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradalumni"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      APP_ENV: development
      WEB_CONCURRENCY: "1"
      DATABASE_URL: postgresql+asyncpg://gradalumni:${POSTGRES_PASSWORD}@db:5432/gradalumni
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DOCUMENT_STORAGE_PATH: /app/uploads/private
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && python scripts/serve.py"]
    volumes:
      - documents:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  documents:
